<div class="listing-card bg-white rounded-2xl overflow-hidden hover:shadow-lg transition-all duration-300 group cursor-pointer" (click)="onCardClick()">
  <!-- Image with Favorite Button -->
  <div class="relative">
    <img 
      [src]="listing.imageUrl" 
      [alt]="listing.title"
      class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500"
    >
    <button 
      (click)="toggleFavorite(); $event.stopPropagation()"
      class="absolute top-3 right-3 p-2 bg-white/80 backdrop-blur-sm rounded-full hover:bg-white transition-all transform hover:scale-110"
    >
      <svg 
        [class.text-red-500]="isFavorite" 
        [class.fill-current]="isFavorite"
        class="w-5 h-5 text-gray-700" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </button>
    
    <!-- Image indicator dots (placeholder for multiple images) -->
    <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 flex space-x-1">
      <div class="w-1.5 h-1.5 bg-white rounded-full opacity-80"></div>
      <div class="w-1.5 h-1.5 bg-white/50 rounded-full"></div>
      <div class="w-1.5 h-1.5 bg-white/50 rounded-full"></div>
    </div>
  </div>

  <!-- Listing Details -->
  <div class="p-5">
    <!-- Location and Type -->
    <div class="flex justify-between items-start mb-2">
      <div class="flex-1">
        <h3 class="text-gray-900 font-semibold text-lg leading-tight mb-1 group-hover:text-gray-700 transition-colors">
          {{ listing.address }}
        </h3>
        <p class="text-gray-500 text-sm">{{ listing.type }}</p>
      </div>
      <!-- Rating (placeholder) -->
      <div class="flex items-center space-x-1 ml-3">
        <svg class="w-4 h-4 text-yellow-400 fill-current" viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        <span class="text-sm font-medium text-gray-900">4.9</span>
      </div>
    </div>

    <!-- Title -->
    <h4 class="text-gray-800 font-medium mb-3 line-clamp-2">{{ listing.title }}</h4>

    <!-- Amenities Pills -->
    <div class="flex flex-wrap gap-2 mb-4">
      <span *ngFor="let amenity of listing.amenities.slice(0, 3)" 
            class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700">
        <!-- WiFi Icon -->
        <svg *ngIf="amenity === 'WiFi'" class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h2.114a4 4 0 001.787-.422l.05-.025A2 2 0 0014 15.764v-5.43a2 2 0 00-1.106-1.79l-.05-.025A4 4 0 0011.057 8H8.943a4 4 0 00-1.787.422l-.05.025A2 2 0 006 10.333z"/>
        </svg>
        <!-- Kitchen Icon -->
        <svg *ngIf="amenity === 'Kitchen'" class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
        </svg>
        <!-- Default Icon for other amenities -->
        <svg *ngIf="amenity !== 'WiFi' && amenity !== 'Kitchen'" class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg>
        {{ amenity }}
      </span>
      <span *ngIf="listing.amenities.length > 3" 
            class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-500">
        +{{ listing.amenities.length - 3 }} more
      </span>
    </div>

    <!-- Date and Price -->
    <div class="flex justify-between items-end">
      <div class="flex-1">
        <p class="text-gray-500 text-sm mb-1">Available now</p>
        <p class="text-xs text-gray-400">{{ listing.deposit }} deposit</p>
      </div>
      <div class="text-right">
        <div class="flex items-baseline space-x-1">
          <span class="text-xl font-semibold text-gray-900">£{{ listing.price }}</span>
          <span class="text-sm text-gray-500 font-medium">/month</span>
        </div>
      </div>
    </div>
  </div>
</div>

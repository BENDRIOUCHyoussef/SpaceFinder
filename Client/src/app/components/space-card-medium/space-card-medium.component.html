<!-- space-card-medium.component.html -->
<div
  class="flex w-full bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow overflow-hidden"
>
  <!-- Image Section -->
  <div class="w-1/4 min-w-[200px] bg-gray-50">
    <img
      *ngIf="space.imageUrl"
      class="object-cover w-full h-full"
      [src]="space.imageUrl"
      [alt]="space.title"
    />
    <div
      *ngIf="!space.imageUrl"
      class="w-full h-full flex items-center justify-center text-gray-300"
    >
      <svg
        class="w-12 h-12"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
        ></path>
      </svg>
    </div>
  </div>

  <!-- Info Section -->
  <div class="flex-1 p-4 flex flex-col justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-900 mb-2">
        {{ space.title }}
      </h3>
      <p class="text-gray-600 text-sm mb-3 line-clamp-2">
        {{ space.description }}
      </p>
    </div>

    <div class="flex items-center gap-2">
      <span class="font-medium text-gray-900">${{ space.price }}/mo</span>
      <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full">
        {{ space.spaceType }}
      </span>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-col justify-center p-4 gap-2">
    <button
      (click)="onEdit()"
      class="cursor-pointer p-2 rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        ></path>
      </svg>
    </button>
    <button
      (click)="onDelete()"
      class="cursor-pointer p-2 rounded-md bg-red-50 text-red-600 hover:bg-red-100 transition-colors"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
        ></path>
      </svg>
    </button>
  </div>
</div>

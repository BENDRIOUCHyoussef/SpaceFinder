<!-- space-image-upload.component.html -->
<div class="max-w-2xl mx-auto py-8 px-4">
  <div class="bg-white shadow rounded-lg overflow-hidden">
    <div class="px-6 py-5 border-b border-gray-200 bg-gray-50">
      <h1 class="text-2xl font-bold text-gray-800">Upload Space Images</h1>
      <p class="mt-1 text-sm text-gray-600">
        Add images for your space listing
      </p>
    </div>

    <div class="px-6 py-5 space-y-6">
      <div
        class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center"
      >
        <input
          type="file"
          id="fileInput"
          (change)="onFileSelected($event)"
          multiple
          accept="image/*"
          class="hidden"
        />
        <label
          for="fileInput"
          class="cursor-pointer flex flex-col items-center justify-center"
        >
          <svg
            class="w-12 h-12 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          <p class="mt-2 text-sm text-gray-600">
            Click to upload images or drag and drop
          </p>
          <p class="mt-1 text-xs text-gray-500">PNG, JPG up to 10MB</p>
        </label>
      </div>

      <!-- Image Previews -->
      <div
        *ngIf="selectedFiles.length > 0"
        class="grid grid-cols-2 md:grid-cols-3 gap-4"
      >
        <div
          *ngFor="let file of selectedFiles; let i = index"
          class="relative group"
        >
          <img
            [src]="file.preview"
            class="w-full h-32 object-cover rounded-md"
          />
          <input
            type="text"
            [(ngModel)]="file.title"
            class="w-full mt-2 p-2 border rounded text-sm"
            placeholder="Image title"
          />
          <button
            type="button"
            (click)="removeImage(i)"
            class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div *ngIf="isUploading" class="pt-4">
        <div class="flex items-center">
          <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div
              class="bg-blue-600 h-2.5 rounded-full"
              [style.width.%]="uploadProgress"
            ></div>
          </div>
          <span class="ml-2 text-sm font-medium text-gray-700"
            >{{ uploadProgress }}%</span
          >
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-3 pt-4">
        <button
          type="button"
          (click)="uploadImages()"
          [disabled]="selectedFiles.length === 0 || isUploading"
          class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-300"
        >
          Upload Images
        </button>
      </div>

      <div *ngIf="error" class="text-red-500 text-sm">{{ error }}</div>
    </div>
  </div>
</div>

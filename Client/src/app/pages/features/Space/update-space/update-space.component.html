<div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <div class="bg-white shadow-xl rounded-lg overflow-hidden">
    <!-- Form Header -->
    <div class="px-8 py-6 bg-gradient-to-r from-blue-600 to-blue-800">
      <h1 class="text-2xl font-bold text-white">Edit Your Space</h1>
      <p class="mt-1 text-sm text-blue-100">
        Update your property details and images
      </p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="p-8 flex justify-center">
      <div
        class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500"
      ></div>
    </div>

    <ng-container *ngIf="model">
      <!-- Image Gallery Section -->
      <div class="px-8 py-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">
          Property Images
        </h2>

        <!-- Current Images -->
        <div *ngIf="spaceImages?.length" class="mb-6">
          <h3 class="text-sm font-medium text-gray-700 mb-3">Current Images</h3>
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div *ngFor="let image of spaceImages" class="relative group">
              <img
                [src]="image.imageUrl"
                alt="Space image"
                class="w-full h-32 object-cover rounded-lg"
              />
              <div
                class="absolute inset-0 bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 flex items-center justify-center rounded-lg transition-opacity"
              >
                <button
                  (click)="deleteImage(image.id)"
                  class="text-white hover:text-red-400 p-2"
                  title="Delete image"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Add New Images -->
        <div>
          <h3 class="text-sm font-medium text-gray-700 mb-3">Add New Images</h3>
          <div class="flex items-center space-x-4">
            <label class="cursor-pointer">
              <span
                class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5 mr-2"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                  />
                </svg>
                Select Images
              </span>
              <input
                type="file"
                class="hidden"
                multiple
                (change)="onFileSelected($event)"
                accept="image/*"
              />
            </label>
            <button
              *ngIf="selectedFiles.length > 0"
              (click)="uploadImages()"
              [disabled]="isUploading"
              class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-400"
            >
              <span *ngIf="!isUploading"
                >Upload {{ selectedFiles.length }} Images</span
              >
              <span *ngIf="isUploading">Uploading...</span>
            </button>
          </div>

          <!-- Selected Files Preview -->
          <div
            *ngIf="selectedFiles.length > 0"
            class="mt-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
          >
            <div
              *ngFor="let file of selectedFiles; let i = index"
              class="relative"
            >
              <img
                [src]="file.preview"
                class="w-full h-32 object-cover rounded-lg"
              />
              <input
                type="text"
                [(ngModel)]="file.title"
                placeholder="Image title"
                class="mt-2 w-full text-sm border-gray-300 rounded"
              />
              <button
                (click)="removeImage(i)"
                class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 hover:bg-red-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Content -->
      <form
        #form="ngForm"
        (ngSubmit)="onFormSubmit()"
        *ngIf="!isLoading"
        class="divide-y divide-gray-200"
      >
        <!-- Basic Information Section -->
        <div class="px-8 py-6 space-y-6">
          <h2 class="text-lg font-semibold text-gray-800">Basic Information</h2>

          <!-- Title -->
          <div>
            <label
              for="title"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Title*</label
            >
            <input
              type="text"
              id="title"
              [(ngModel)]="model.title"
              name="title"
              required
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
              placeholder="e.g. Bright Double Room in Shoreditch"
            />
          </div>

          <!-- Description -->
          <div>
            <label
              for="description"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Description*</label
            >
            <textarea
              id="description"
              [(ngModel)]="model.description"
              name="description"
              rows="4"
              required
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
              placeholder="Tell potential tenants about your space..."
            ></textarea>
          </div>
        </div>

        <!-- Property Details Section -->
        <div class="px-8 py-6 space-y-6">
          <h2 class="text-lg font-semibold text-gray-800">Property Details</h2>

          <!-- Space Type -->
          <div>
            <label
              for="spaceType"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Space Type*</label
            >
            <select
              id="spaceType"
              [(ngModel)]="model.spaceType"
              name="spaceType"
              required
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
            >
              <option *ngFor="let type of spaceTypeOptions" [value]="type">
                {{ type }}
              </option>
            </select>
          </div>

          <!-- Number of Rooms -->
          <div>
            <label
              for="numberOfRooms"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Number of Rooms*</label
            >
            <input
              type="number"
              id="numberOfRooms"
              [(ngModel)]="model.numberOfRooms"
              name="numberOfRooms"
              required
              min="1"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
            />
          </div>

          <!-- Number of Bathrooms -->
          <div>
            <label
              for="numberOfBathrooms"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Bathrooms*</label
            >
            <input
              type="number"
              id="numberOfBathrooms"
              [(ngModel)]="model.numberOfBathrooms"
              name="numberOfBathrooms"
              required
              min="1"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
            />
          </div>

          <!-- Furnished -->
          <div class="flex items-center">
            <input
              id="furnished"
              [(ngModel)]="model.furnished"
              name="furnished"
              type="checkbox"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
            <label for="furnished" class="ml-2 block text-sm text-gray-700"
              >Furnished</label
            >
          </div>
        </div>

        <!-- Location Section -->
        <div class="px-8 py-6 space-y-6">
          <h2 class="text-lg font-semibold text-gray-800">Location</h2>

          <div class="grid grid-cols-1 gap-6">
            <!-- Address -->
            <div>
              <label
                for="address"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Full Address*</label
              >
              <input
                type="text"
                id="address"
                [(ngModel)]="model.address"
                name="address"
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
              />
            </div>

            <!-- City -->
            <div>
              <label
                for="city"
                class="block text-sm font-medium text-gray-700 mb-1"
                >City*</label
              >
              <input
                type="text"
                id="city"
                [(ngModel)]="model.city"
                name="city"
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
              />
            </div>

            <!-- Postcode -->
            <div>
              <label
                for="postCode"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Postcode*</label
              >
              <input
                type="text"
                id="postCode"
                [(ngModel)]="model.postCode"
                name="postCode"
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
              />
            </div>
          </div>
        </div>

        <!-- Pricing Section -->
        <div class="px-8 py-6 space-y-6">
          <h2 class="text-lg font-semibold text-gray-800">Pricing</h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Monthly Price -->
            <div>
              <label
                for="price"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Monthly Price (£)*</label
              >
              <div class="mt-1 relative rounded-md shadow-sm">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <span class="text-gray-500">£</span>
                </div>
                <input
                  type="number"
                  id="price"
                  [(ngModel)]="model.price"
                  name="price"
                  required
                  min="0"
                  step="50"
                  class="block w-full pl-7 pr-12 rounded-md border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
                />
              </div>
            </div>

            <!-- Deposit -->
            <div>
              <label
                for="deposit"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Deposit (£)*</label
              >
              <div class="mt-1 relative rounded-md shadow-sm">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <span class="text-gray-500">£</span>
                </div>
                <input
                  type="number"
                  id="deposit"
                  [(ngModel)]="model.deposit"
                  name="deposit"
                  required
                  min="0"
                  step="50"
                  class="block w-full pl-7 pr-12 rounded-md border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm py-2 px-3 border"
                />
              </div>
            </div>

            <!-- Bills Included -->
            <div class="flex items-center">
              <input
                id="billsIncluded"
                [(ngModel)]="model.billsIncluded"
                name="billsIncluded"
                type="checkbox"
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
              />
              <label
                for="billsIncluded"
                class="ml-2 block text-sm text-gray-700"
                >Bills included in price</label
              >
            </div>
          </div>
        </div>

        <!-- Availability Section -->
        <div class="px-8 py-6 space-y-6">
          <h2 class="text-lg font-semibold text-gray-800">Availability</h2>

          <div>
            <label
              for="availableFrom"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Available From*</label
            >
            <input
              type="date"
              id="availableFrom"
              [(ngModel)]="model.availableFrom"
              name="availableFrom"
              required
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 px-3 border"
            />
          </div>
        </div>

        <!-- Form Footer -->
        <div class="px-8 py-6 bg-gray-50 flex justify-between">
          <button
            type="button"
            (click)="onCancel()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="!form.valid || isUploading"
            class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed"
          >
            <svg
              *ngIf="isSaving"
              class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            {{ isSaving ? "Saving..." : "Save Changes" }}
          </button>
        </div>
      </form>
    </ng-container>
  </div>
</div>
